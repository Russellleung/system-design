services:
  - type: web
    name: closet-compass
    runtime: docker
    plan: free
    region: singapore
    rootDir: autonomous-code-factory/apps/wardrobe-advisor
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: VISION_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3.5-flash-lite
      # Paid image generation is deliberately off until explicitly approved.
      - key: GEMINI_IMAGE_MODEL
        value: ""
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5.4-mini
