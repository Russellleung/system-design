services:
  - type: web
    name: closet-compass
    runtime: docker
    plan: free
    region: singapore
    rootDir: autonomous-code-factory/apps/wardrobe-advisor
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: VISION_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3.5-flash-lite
      - key: VISUAL_MATCH_PROVIDER
        value: openai
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: OPENAI_IMAGE_QUALITY
        value: high
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-2-klein-4b"
      # Optional paid fallback; not used while Visual Match selects OpenAI.
      - key: GEMINI_IMAGE_MODEL
        value: ""
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5.4-mini
