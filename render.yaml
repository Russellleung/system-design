services:
  - type: web
    name: closet-compass
    runtime: docker
    plan: free
    region: singapore
    rootDir: autonomous-code-factory/apps/wardrobe-advisor
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
