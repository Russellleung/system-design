services:
  - type: web
    name: closet-compass
    runtime: docker
    plan: free
    region: singapore
    rootDir: autonomous-code-factory/apps/wardrobe-advisor
    dockerfilePath: ./autonomous-code-factory/apps/wardrobe-advisor/Dockerfile
    dockerContext: ./autonomous-code-factory/apps/wardrobe-advisor
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
